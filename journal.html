<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal — Meet Bhatt</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f0ebe0;--ink:#181714;--moss:#3d5a3e;--mid:#6b6560;--faint:#d4cfc6;--mono:'Space Mono',monospace;--sans:'Space Grotesk',sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);overflow-x:hidden;opacity:0;transition:opacity .4s;
  background-image:
    linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
  background-size:28px 28px;
}
body.ready{opacity:1;}

nav{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;border-bottom:1px solid var(--faint);background:rgba(240,235,224,0.94);backdrop-filter:blur(10px);}
.nav-logo{width:32px;height:32px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.6rem;font-weight:700;color:var(--ink);text-decoration:none;transition:background .2s,color .2s;}
.nav-logo:hover{background:var(--ink);color:var(--paper);}
.nav-links{display:flex;gap:2rem;list-style:none;}
.nav-links a{font-family:var(--mono);font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);text-decoration:none;transition:color .2s;}
.nav-links a:hover,.nav-links a.active{color:var(--ink);}
.nav-back{font-family:var(--mono);font-size:.63rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);text-decoration:none;transition:color .2s;}
.nav-back:hover{color:var(--ink);}
.hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px;}
.hamburger span{display:block;width:20px;height:1px;background:var(--ink);transition:all .25s;}
.hamburger.open span:nth-child(1){transform:translateY(6px) rotate(45deg);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}
.mmenu{display:none;position:fixed;top:57px;left:0;right:0;background:var(--paper);border-bottom:1px solid var(--faint);padding:1rem 2rem;z-index:490;flex-direction:column;}
.mmenu.open{display:flex;}
.mmenu a{font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);text-decoration:none;padding:.8rem 0;border-bottom:1px solid var(--faint);transition:color .2s;}
.mmenu a:last-child{border-bottom:none;}
.mmenu a:hover{color:var(--ink);}

/* HERO */
#hero{padding:7rem 2rem 3rem;border-bottom:2px solid var(--ink);}
.log-id{font-family:var(--mono);font-size:.62rem;color:var(--mid);letter-spacing:.1em;margin-bottom:1.5rem;}
.page-title{font-family:var(--sans);font-weight:700;font-size:clamp(4rem,12vw,11rem);line-height:.88;letter-spacing:-.03em;margin-bottom:1rem;}
.page-title span{color:var(--moss);}
.page-sub{font-family:var(--mono);font-size:.68rem;color:var(--mid);letter-spacing:.08em;border-top:1px solid var(--faint);padding-top:1rem;}

/* SCATTER LAYOUT */
.scatter{
  padding:4rem 2rem 6rem;
  position:relative;
  min-height:100vh;
  display:flex;
  flex-wrap:wrap;
  gap:0;
  align-items:flex-start;
}

.photo-card{
  position:relative;
  background:#fff;
  padding:10px 10px 36px;
  box-shadow:2px 4px 16px rgba(0,0,0,.12);
  transition:transform .3s, box-shadow .3s;
  cursor:default;
  flex-shrink:0;
}
.photo-card:hover{
  box-shadow:4px 8px 28px rgba(0,0,0,.2);
  z-index:10;
}
.photo-card img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* Varied sizes */
.sz-sm { width:200px; height:160px; }
.sz-md { width:280px; height:210px; }
.sz-lg { width:360px; height:270px; }
.sz-sq { width:220px; height:220px; }
.sz-tall{ width:180px; height:260px; }
.sz-wide{ width:380px; height:200px; }

/* Rotations */
.r1  { transform:rotate(-3deg); }
.r2  { transform:rotate(2deg); }
.r3  { transform:rotate(-1.5deg); }
.r4  { transform:rotate(3.5deg); }
.r5  { transform:rotate(-2.5deg); }
.r6  { transform:rotate(1deg); }
.r7  { transform:rotate(-4deg); }
.r8  { transform:rotate(2.5deg); }
.r9  { transform:rotate(-1deg); }
.r10 { transform:rotate(3deg); }
.r11 { transform:rotate(-2deg); }
.r12 { transform:rotate(1.5deg); }

.photo-card:hover.r1,
.photo-card:hover.r2,
.photo-card:hover.r3,
.photo-card:hover.r4,
.photo-card:hover.r5,
.photo-card:hover.r6,
.photo-card:hover.r7,
.photo-card:hover.r8,
.photo-card:hover.r9,
.photo-card:hover.r10,
.photo-card:hover.r11,
.photo-card:hover.r12 { transform:rotate(0deg) scale(1.02); }

/* Margins for scatter feel */
.m1  { margin:20px 8px 0 24px; }
.m2  { margin:60px 16px 0 -10px; }
.m3  { margin:10px 8px 0 32px; }
.m4  { margin:40px 24px 0 -8px; }
.m5  { margin:80px 8px 0 16px; }
.m6  { margin:20px 16px 0 -12px; }
.m7  { margin:50px 8px 0 28px; }
.m8  { margin:30px 20px 0 -4px; }
.m9  { margin:70px 8px 0 12px; }
.m10 { margin:15px 16px 0 -8px; }
.m11 { margin:45px 8px 0 20px; }
.m12 { margin:25px 12px 0 -16px; }

/* tape effect on some cards */
.tape::before{
  content:'';
  position:absolute;
  top:-12px;
  left:50%;
  transform:translateX(-50%) rotate(-2deg);
  width:60px;height:22px;
  background:rgba(200,190,160,.55);
  z-index:2;
}

footer{padding:1.2rem 2rem;display:flex;justify-content:space-between;border-top:1px solid var(--faint);}
footer p{font-family:var(--mono);font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);}

@media(max-width:700px){
  nav{padding:.9rem 1.2rem;}
  .nav-links,.nav-back{display:none;}
  .hamburger{display:flex;}
  #hero{padding:6.5rem 1.2rem 2rem;}
  .scatter{padding:2rem 1rem 4rem;justify-content:center;}
  .sz-sm,.sz-md,.sz-lg,.sz-sq,.sz-tall,.sz-wide{width:42vw;height:32vw;}
  .sz-tall{height:52vw;}
  .sz-sq{height:42vw;}
  .m1,.m2,.m3,.m4,.m5,.m6,.m7,.m8,.m9,.m10,.m11,.m12{margin:8px 4px;}
  footer{flex-direction:column;gap:.3rem;text-align:center;padding:1rem 1.2rem;}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">MB</a>
  <ul class="nav-links">
    <li><a href="index.html#work">Work</a></li>
    <li><a href="index.html#about-anchor">About</a></li>
    <li><a href="fieldnotes.html">Field Notes</a></li>
    <li><a href="journal.html" class="active">Journal</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
  <a href="index.html" class="nav-back">← Portfolio</a>
  <button class="hamburger" id="ham"><span></span><span></span><span></span></button>
</nav>
<div class="mmenu" id="mob">
  <a href="index.html#work">Work</a>
  <a href="index.html#about-anchor">About</a>
  <a href="fieldnotes.html">Field Notes</a>
  <a href="journal.html">Journal</a>
  <a href="index.html#contact">Contact</a>
</div>

<section id="hero">
  <div class="log-id">FIELD JOURNAL / BIRDS & WILDLIFE / INDIA</div>
  <h1 class="page-title">FIELD<br><span>JOURNAL</span></h1>
  <div class="page-sub">Birds & Wildlife across India</div>
</section>

<div class="scatter">
  <div class="photo-card sz-lg r1 m1 tape">
    <img src="1.JPG" alt="">
  </div>
  <div class="photo-card sz-md r2 m2">
    <img src="2.JPG" alt="">
  </div>
  <div class="photo-card sz-tall r3 m3">
    <img src="3.JPG" alt="">
  </div>
  <div class="photo-card sz-sm r4 m4 tape">
    <img src="4.JPG" alt="">
  </div>
  <div class="photo-card sz-wide r5 m5">
    <img src="5.JPG" alt="">

  <div class="photo-card sz-sq r6 m6 tape">
    <img src="6.JPG" alt="">
  </div>
  <div class="photo-card sz-md r7 m7">

  </div>
  <div class="photo-card sz-lg r8 m8">

  </div>
  <div class="photo-card sz-sm r9 m9 tape">
    <img src="9.JPG" alt="">
  </div>
  <div class="photo-card sz-tall r10 m10">
    <img src="10.JPG" alt="">
  </div>
  <div class="photo-card sz-wide r11 m11 tape">
    <img src="11.JPG" alt="">
  </div>
  <div class="photo-card sz-md r12 m12">
    <img src="12.JPG" alt="">
  </div>
</div>

<footer>
  <p>Meet Bhatt · Field Journal · Pune 2026</p>
  <p>Birds & Wildlife · India</p>
</footer>

<script>
document.body.classList.add('ready');
const ham=document.getElementById('ham');
const mob=document.getElementById('mob');
ham.addEventListener('click',()=>{ham.classList.toggle('open');mob.classList.toggle('open');});
mob.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{ham.classList.remove('open');mob.classList.remove('open');}));
window.addEventListener('pageshow',()=>document.body.style.opacity='1');
</script>
</body>
</html>
